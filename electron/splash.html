<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0a0a0a; overflow: hidden; height: 100%;
    font-family: Helvetica, Arial, sans-serif; -webkit-app-region: drag; user-select: none; }
  .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; border: 1px solid #2a2a2a; }
  img { width: 300px; height: 300px; object-fit: cover;
    border: 1px solid #333; box-shadow: 0 0 0 1px #000, 6px 6px 0 rgba(0,0,0,.5); }
  h1 { color: #f0ece0; font-size: 13px; letter-spacing: .3em; margin-top: 26px; font-weight: 700; }
  p { color: #666; font-size: 9px; letter-spacing: .2em; margin-top: 8px; text-transform: uppercase; }
  .bar { width: 300px; height: 3px; background: #1c1c1c; margin-top: 20px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; background: #f0ece0;
    animation: scan 1.1s ease-in-out infinite; }
  @keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
</style>
</head>
<body>
  <div class="wrap">
    <img src="../public/logosulaw.png" alt="">
    <h1>SULAWESI'S GROTTO</h1>
    <p>petroglyph engine · est. 45,500 bce</p>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
