name: Build releases

# builds unsigned windows + mac apps on real runners
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run dist:mac
      - run: |
          cd release
          tar -czf SulawesiGrotto-mac-arm64.tar.gz SulawesiGrotto-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sulawesi-mac-arm64
          path: release/SulawesiGrotto-mac-arm64.tar.gz

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: sulawesi-win-x64
          path: release/SulawesiGrotto-win32-x64
